<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seras mi San Valentín? </title>
    <link rel="stylesheet" href="valentine_style.css"/>
</head>
<body>
    <div class="wrapper">
        <h2 class="question">Holis! Seras mi San Valentín? </h2>
        
        <!-- Primer GIF de declaración -->
        <img 
            src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExejV1emNheWljbnk2OXVvdWxlcGU3YXcyZnVjMXlyZW4wZzV5ajJ4eiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/LH5Bet9YHsJaQar1TC/giphy.gif" 
            alt="Cute Valentine GIF" 
            class="valentine-gif"
        >

        <p class="declaration-text">
            He estado pensando… y no podía dejar pasar el día de San Valentín sin preguntarte algo importante.  
            <strong>¿Quieres ser mi Valentine?</strong> 💖  
            Con un si, prometo llenar tu día de risas, cariño, y flores!
        </p>

        <div class="btn-group">
            <button class="yes-btn">¡Sí!</button>
            <button class="no-btn">No 😅</button>
        </div>
    </div>
    <script src="valentine_script.js"></script>
</body>
</html>
